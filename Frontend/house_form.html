<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>House Price Prediction</title>
</head>

<body>

    <h1>House Price Prediction</h1>

    <form id="houseForm">

        <label for="area">Area (m²):</label>
        <input type="number" id="area" min="0.01" step="any" required>
        <br><br>

        <label for="bedrooms">Bedrooms:</label>
        <input type="number" id="bedrooms" min="0" required>
        <br><br>

        <label for="distance">Distance to center (km):</label>
        <input type="number" id="distance" min="0" step="any" required>
        <br><br>

        <button type="submit">Predict Price</button>

    </form>

    <h3 id="result"></h3>

    <script>
        const form = document.getElementById("houseForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const area = document.getElementById("area").value;
            const bedrooms = document.getElementById("bedrooms").value;
            const distance = document.getElementById("distance").value;

            try {
                const response = await fetch("/predict/house-price", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        area_sqm: Number(area),
                        bedrooms: Number(bedrooms),
                        distance_to_center_km: Number(distance)
                    })
                });

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();

                result.textContent =
                    `Predicted Price: ${data.predicted_price.toLocaleString()} VND`;

            } catch (error) {
                result.textContent = "Error: Could not get prediction.";
            }
        });
    </script>

</body>

</html>
