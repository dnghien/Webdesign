<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>House Price Prediction</title>
</head>

<body>

    <h1>House Price Prediction</h1>

    <form id="houseForm">

        <label for="area">Area (m²):</label>
        <input type="number" id="area" required>
        <br><br>

        <label for="bedrooms">Bedrooms:</label>
        <input type="number" id="bedrooms" required>
        <br><br>

        <label for="location">Location:</label>
        <input type="text" id="location" value="other">
        <br><br>

        <button type="submit">Predict Price</button>

    </form>

    <h3 id="result"></h3>

    <script>
        const form = document.getElementById("houseForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const area = document.getElementById("area").value;
            const bedrooms = document.getElementById("bedrooms").value;
            const location = document.getElementById("location").value;

            try {
                const response = await fetch(
                    `/predict?area=${area}&bedrooms=${bedrooms}&location=${location}`
                );

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();

                result.textContent =
                    `Predicted Price: ${data.predicted_price.toLocaleString()} VND`;

            } catch (error) {
                result.textContent = "Error: Could not get prediction.";
            }
        });
    </script>

</body>

</html>
